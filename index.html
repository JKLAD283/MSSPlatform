<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(#87CEEB, #4FC3F7); 
            height: 100vh; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
            perspective: 1200px;
            transform-style: preserve-3d;
        }
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* 3D Adam */
        .guy {
            position: absolute;
            bottom: 5%;
            left: 10%;
            width: 180px;
            z-index: 4;
            transform-style: preserve-3d;
            animation: walk 2s steps(5) forwards, rotateGuy 1s ease forwards 4s;
            animation-delay: 800ms;
        }
        @keyframes walk {
            0% { left: 10%; transform: rotateY(15deg) translateZ(0); }
            50% { left: 25%; transform: rotateY(10deg) translateZ(10px); }
            100% { left: 25%; transform: rotateY(15deg) translateZ(0); }
        }
        @keyframes rotateGuy {
            to { left: 85%; bottom: 0%; transform: translateX(-50%) rotateY(-20deg) rotateX(5deg) rotateZ(15deg) translateZ(20px); }
        }
        .guy-shadow {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 70%;
            height: 15px;
            background: radial-gradient(rgba(0,0,0,0.3), transparent);
            border-radius: 50%;
            z-index: 1;
            transform: translateX(-50%) translateZ(-10px);
        }

        /* 3D Çanta - ÇOK YUKARIDA! */
        .bag {
            position: absolute;
            bottom: 40%; /* Çok yukarı çekildi */
            left: 18%;
            width: 60px;
            z-index: 1;
            transform-style: preserve-3d;
            transform: rotateY(20deg) translateZ(5px);
            transition: all 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .bag.throw {
            transform: translateX(-50%) rotateY(30deg) rotateZ(720deg) scale(1.4) translateZ(15px);
            left: 30%;
            bottom: 20%; /* Fırlatıldıktan sonra da yukarıda */
            z-index: 1;
        }
        .bag.open {
            transform: translateX(-50%) rotateY(30deg) rotateZ(720deg) scale(1.4) translateZ(20px) translateY(-5px);
            transition: all 1s ease;
        }
        .bag-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transform-style: preserve-3d;
            transition: all 0.8s ease;
            transform-origin: bottom center;
        }
        .bag-top.open {
            transform: rotateX(70deg) translateY(-10px) translateZ(5px);
        }
        .bag-shadow {
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 80%;
            height: 10px;
            background: radial-gradient(rgba(0,0,0,0.25), transparent);
            border-radius: 50%;
            z-index: 0;
            transform: translateX(-50%) translateZ(-5px);
        }

        /* 3D Giriş Ekranı */
        .login-screen {
            position: absolute;
            bottom: 0%;
            left: 50%;
            width: 90%;
            max-width: 400px;
            height: 60vh;
            background: white;
            padding: 2.5rem;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 10px 50px rgba(0,0,0,0.2);
            opacity: 0;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform-style: preserve-3d;
            transform: translateX(-50%) translateY(30px) scale(0.1) rotateY(-5deg) translateZ(0);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .login-screen.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1) rotateY(-5deg) translateZ(10px);
        }
        .login-screen::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 15px;
            height: 100%;
            background: #f0f0f0;
            border-radius: 15px 0 0 0;
            transform: rotateY(90deg) translateZ(-15px) translateX(-7.5px);
            transform-style: preserve-3d;
        }
        .login-screen input {
            width: 100%;
            margin: 1rem 0;
            padding: 1.2rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .login-screen button {
            width: 100%;
            padding: 1.2rem;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 1rem;
            transform-style: preserve-3d;
            transform: translateZ(5px);
            box-shadow: 0 5px 10px rgba(33, 150, 243, 0.3);
            transition: transform 0.3s ease;
        }
        .login-screen button:hover {
            transform: translateZ(8px);
        }
        .login-screen h2 {
            margin-bottom: 2rem;
            color: #333;
            font-size: 1.8rem;
            transform: translateZ(10px);
        }
        svg { filter: drop-shadow(0 5px 3px rgba(0,0,0,0.2)); }
    </style>
    <title>MSS WEB SİTESİ - GİRİŞ YAP</title>
</head>
<body>
    <div class="scene">
        <!-- 3D Adam -->
        <div class="guy" id="guy">
            <div class="guy-shadow"></div>
            <svg viewBox="0 0 100 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="hg" cx="50%" cy="30%" r="80%" fx="50%" fy="30%">
                        <stop offset="0%" stop-color="#f8d5b8"/><stop offset="100%" stop-color="#e0b99c"/>
                    </radialGradient>
                    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1976D2"/><stop offset="100%" stop-color="#1565C0"/>
                    </linearGradient>
                    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0D47A1"/><stop offset="100%" stop-color="#0A2C5A"/>
                    </linearGradient>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#8b5a2b"/><stop offset="100%" stop-color="#7d4d24"/>
                    </linearGradient>
                </defs>
                <!-- Baş -->
                <circle cx="50" cy="30" r="18" fill="url(#hg)"/>
                <circle cx="45" cy="27" r="2.5" fill="#333"/><circle cx="55" cy="27" r="2.5" fill="#333"/>
                <path d="M45 35 Q50 38 55 35" stroke="#333" stroke-width="1.5" fill="none"/>
                <path d="M32 18 Q50 5 68 18 L65 30 Q50 25 35 30 Z" fill="#4a342a"/>
                <path d="M40 23 Q45 22 48 24" stroke="#333" stroke-width="1.5" fill="none"/>
                <path d="M52 24 Q55 22 60 23" stroke="#333" stroke-width="1.5" fill="none"/>
                <circle cx="55" cy="32" r="10" fill="rgba(0,0,0,0.05)" opacity="0.5"/>
                <!-- Vücut -->
                <rect x="40" y="48" width="20" height="60" fill="#f8d5b8"/>
                <rect x="35" y="55" width="30" height="50" fill="url(#sg)"/>
                <path d="M40 55 Q50 52 60 55" stroke="#1565C0" stroke-width="1.5" fill="none"/>
                <circle cx="50" cy="70" r="3" fill="#1565C0"/>
                <path d="M50 73 L50 85" stroke="#1565C0" stroke-width="1.5" fill="none"/>
                <!-- Kollar -->
                <rect x="25" y="55" width="15" height="45" fill="#f8d5b8" transform="rotate(-10 32.5 77.5)"/>
                <rect x="60" y="55" width="20" height="50" fill="#f8d5b8" transform="rotate(20 70 80)"/>
                <circle cx="78" cy="95" r="6" fill="url(#hg)"/>
                <!-- Bacaklar -->
                <rect x="40" y="108" width="10" height="80" fill="url(#pg)" transform="rotate(-5 45 148)"/>
                <rect x="50" y="108" width="10" height="80" fill="url(#pg)" transform="rotate(5 55 148)"/>
                <path d="M40 130 L50 130" stroke="#0A2C5A" stroke-width="1" fill="none"/>
                <path d="M40 160 L50 160" stroke="#0A2C5A" stroke-width="1" fill="none"/>
                <!-- Ayakkabılar -->
                <rect x="38" y="188" width="14" height="10" fill="#212121" rx="2"/>
                <rect x="48" y="188" width="14" height="10" fill="#212121" rx="2"/>
                <path d="M38 193 L52 193" stroke="#424242" stroke-width="1.5" fill="none"/>
                <path d="M48 193 L62 193" stroke="#424242" stroke-width="1.5" fill="none"/>
            </svg>
        </div>

        <!-- 3D Çanta - ARTİK YUKARIDA GÖRÜNÜYOR! -->
        <div class="bag" id="bag">
            <div class="bag-shadow"></div>
            <svg viewBox="0 0 60 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="15" width="40" height="40" rx="5" fill="url(#bg)"/>
                <path d="M10 15 L0 25 M50 15 L60 25" stroke="#5d3a1f" stroke-width="2"/>
                <path d="M20 55 L40 55" stroke="#5d3a1f" stroke-width="2"/>
                <circle cx="30" cy="35" r="3" fill="#5d3a1f"/>
                <path d="M15 30 L45 30" stroke="#5d3a1f" stroke-width="1.5" fill="none"/>
                <rect x="22" y="38" width="16" height="10" rx="2" fill="#7d4d24"/>
                <rect x="12" y="18" width="36" height="37" rx="5" fill="rgba(0,0,0,0.1)" opacity="0.7"/>
            </svg>
            <div class="bag-top" id="bagTop">
                <svg viewBox="0 0 60 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="5" width="40" height="15" rx="5" fill="url(#bg)"/>
                    <rect x="25" y="0" width="10" height="10" fill="url(#bg)"/>
                    <path d="M10 15 L0 25 M50 15 L60 25" stroke="#5d3a1f" stroke-width="2"/>
                    <path d="M15 10 L45 10" stroke="#5d3a1f" stroke-width="1.5" fill="none"/>
                </svg>
            </div>
        </div>

        <!-- Giriş Ekranı -->
        <div class="login-screen" id="login">
            <h2>GİRİŞ YAP</h2>
            <input type="email" placeholder="E-posta" required>
            <input type="password" placeholder="Şifre" required>
            <button onclick="window.location.href='home.html'">GİRİŞ YAP</button>
        </div>
    </div>

    <script>
        const guy = document.getElementById('guy');
        const bag = document.getElementById('bag');
        const bagTop = document.getElementById('bagTop');
        const login = document.getElementById('login');
        
        setTimeout(() => bag.classList.add('throw'), 1500);
        setTimeout(() => { bag.classList.add('open'); bagTop.classList.add('open'); }, 3500);
        setTimeout(() => login.classList.add('show'), 4200);
    </script>
</body>
</html>
